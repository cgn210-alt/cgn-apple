<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
<!-- 카카오톡 등 링크 공유 썸네일 원본. ?admin 을 붙이면 관리자용. 1200x630 으로 캡처해서 PNG 로 저장 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif; position:relative;
    background:
      radial-gradient(700px 500px at 0% 0%, rgba(255,255,255,0.7), transparent 60%),
      linear-gradient(135deg, #fff8ec 0%, #ffe9c7 100%);
  }
  .frame { position:absolute; inset:22px; border:3px solid #f0dcc0; border-radius:22px; }
  .pill { position:absolute; top:70px; left:72px; font-size:24px; font-weight:700; color:#fff; background:#2f7d32; padding:8px 22px; border-radius:30px; }
  .title { position:absolute; top:132px; left:68px; font-family:'Jua', sans-serif; font-size:104px; line-height:1.12; color:#2b1d14; }
  .title .honey { color:#f4a91d; }
  .title .red { color:#d62828; }
  .subtitle { position:absolute; top:396px; left:72px; font-size:30px; font-weight:700; color:#7a4b2a; line-height:1.55; }
  .footer-tag { position:absolute; bottom:56px; left:72px; font-size:22px; font-weight:700; color:#fff; background:#d62828; padding:8px 20px; border-radius:24px; }
  .art { position:absolute; right:56px; top:80px; }
  /* 관리자용: 관리자 페이지와 같은 어두운 남색 */
  body.admin { background: radial-gradient(700px 500px at 0% 0%, rgba(255,255,255,0.08), transparent 60%), linear-gradient(135deg, #1f2937 0%, #0f172a 100%); }
  body.admin .frame { border-color: rgba(255,255,255,0.18); }
  body.admin .pill { background:#f4a91d; color:#1f2937; }
  body.admin .title { color:#f8fafc; }
  body.admin .title .red { color:#f87171; }
  body.admin .subtitle { color:#cbd5e1; }
  body.admin .footer-tag { background:#f8fafc; color:#1f2937; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="pill">경북 김천 대덕산 해발 600m</div>
<div class="title">
  <div>철하네 <span class="honey">꿀</span></div>
  <div class="red">부사사과</div>
</div>
<div class="subtitle" id="sub">아삭하고 달콤한 산지 직송 부사사과<br>가격 · 주문 계산기 · 사과 따기</div>
<div class="footer-tag" id="tag">전 품목 배송료 포함</div>

<svg class="art" width="440" height="470" viewBox="0 0 40 43" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ag" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset=".55" stop-color="#d62828"/><stop offset="1" stop-color="#8e1414"/>
    </radialGradient>
  </defs>
  <ellipse cx="20" cy="41.5" rx="13" ry="1.4" fill="#000" opacity=".1"/>
  <g transform="translate(0 2)">
    <path d="M20 12c-3-3-9-4-13 0-5 5-4 15 0 21 3 4 7 6 10 5 1-.4 2-.6 3-.6s2 .2 3 .6c3 1 7-1 10-5 4-6 5-16 0-21-4-4-10-3-13 0z" fill="url(#ag)"/>
    <ellipse cx="12.5" cy="18" rx="2.6" ry="4.2" fill="#fff" opacity=".35" transform="rotate(20 12.5 18)"/>
    <path d="M20 12c0-3 1-6 3-8" stroke="#6b4423" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M22 8c3-4 8-4 10-2-3 3-7 4-10 2z" fill="#3a9d3f"/>
    <path d="M30 13c0 5 1.2 8 1.2 10.5a1.8 1.8 0 0 1-3.6 0c0-2.5 1.2-5.5 1.2-10.5z" fill="#f4a91d" opacity=".95"/>
  </g>
</svg>
<script>
  if (location.search.indexOf('admin') >= 0) {
    document.body.classList.add('admin');
    document.querySelector('.pill').textContent = '관리자 모드';
    document.getElementById('sub').innerHTML = '관리자 전용<br>가격 · 연락처 · 지난 이야기 수정';
    document.getElementById('tag').textContent = '관리자 페이지';
  }
</script>
</body>
</html>
